## Acceptance Criteria
- [x] Batch file accepts two arguments (video path, output folder)
- [x] Validates video file exists before ffmpeg call
- [x] Converts relative paths to absolute paths using `for %%I in ("%VIDEO%") do set "VIDEO_ABS=%%~fI"`
- [x] Creates output directory if missing
- [x] Reports clear error messages with usage examples
- [x] Documentation includes PowerShell alternative and SmartScreen fix

## Notes
- Batch files may be blocked by SmartScreen on Windows
- PowerShell alternative is the preferred method
- SmartScreen can be bypassed with `Get-ChildItem *.bat | Unblock-File`
