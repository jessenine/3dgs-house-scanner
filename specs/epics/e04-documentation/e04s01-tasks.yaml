### Task: Full pipeline documentation
- **ID**: e04s01t03
- **Description**: Document complete command sequence
- **Verify**:
  ```powershell
  # Verify all commands documented:
  # 1. Create venv
  python -m venv gs-env
  .\gs-env\Scripts\Activate.ps1
  
  # 2. Install PyTorch
  pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126
  
  # 3. Process photos
  python -m nerfstudio.scripts.process_data C:\photos C:\output --data-type images
  
  # 4. Train
  python -m nerfstudio.scripts.train splatfacto --data C:\output\data --output-dir C:\output\results --load-config ""
  
  # 5. Export
  python -m nerfstudio.scripts.export --load-config C:\output\results\config.yml --output-path C:\output\point_cloud
  
  # 6. View
  Start-Process "https://superspl.at/editor"
  ```
- **Status**: Complete

