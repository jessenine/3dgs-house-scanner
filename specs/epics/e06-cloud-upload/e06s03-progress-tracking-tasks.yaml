## Title
Progress Tracking with Real-Time Updates

## BCPs
5

## Status
failing

## Tasks

### Task: Upload progress
- **ID**: e06s03t01
- **Description**: Track upload percentage for each photo
- **Verify**:
  ```powershell
  # Test upload progress output
  $progress = .\upload.ps1 -Service polycam -PhotoPath "C:\photos" -OutputPath "C:\output" | Select-String "Upload: \d+%"
  Write-Host "Progress: $progress"
  ```
- **Risk**: P2
- **Status**: failing

### Task: Processing status
- **ID**: e06s03t02
- **Description**: Poll service API and show processing status
- **Verify**:
  ```powershell
