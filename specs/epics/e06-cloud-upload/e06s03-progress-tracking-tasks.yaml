- **Risk**: P3
- **Status**: failing

### Task: Download after processing
- **ID**: e06s03t04
- **Description**: Download processed .ply or .spz file automatically
- **Verify**:
  ```powershell
  # Test download
  Test-Path "C:\output\results.ply"
  Test-Path "C:\output\results.spz"
  ```
- **Risk**: P1
- **Status**: failing

## Acceptance Criteria
- [ ] Upload progress shows percentage (0-100%)
- [ ] Processing status shows: queued, processing, completed, failed
- [ ] Estimated completion time is displayed (e.g., "Estimated: 45 min")
- [ ] Processed file downloaded automatically to OutputPath
- [ ] Output files: .ply (raw) or .spz (compressed)
- [ ] Error handling for failed processing

## Notes
- Poll interval: 30 seconds during processing
- Max wait time: 90 minutes (then timeout)
- Download formats: .ply (500MB-2GB), .spz (50-200MB)
- Completion message: "Processing complete! Downloaded: C:\output\results.ply"
