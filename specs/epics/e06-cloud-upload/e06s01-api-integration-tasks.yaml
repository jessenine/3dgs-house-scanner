  $token = "YOUR_TOKEN"
  $jobId = "JOB_ID_FROM_UPLOAD"
  $response = Invoke-RestMethod -Uri "https://app.polycam.com/api/status/$jobId" -Method Get -Headers @{"Authorization"="Bearer $token"}
  Write-Host "Status: $($response.status)"
