## Acceptance Criteria
- [ ] Polycam API token accepted and upload succeeds
- [ ] Luma AI API token accepted and upload succeeds
- [ ] Splat3D API token accepted and upload succeeds
- [ ] Status polling returns correct processing status
- [ ] Error handling for invalid tokens
- [ ] Error handling for service unavailable

## Notes
- API tokens must be provided via environment variable or explicit parameter
- Rate limiting: Polycam 10 uploads/hour, Luma AI 5 uploads/hour, Splat3D 20 uploads/hour
- File size limits: Polycam 500MB, Luma AI 1GB, Splat3D 2GB
- Processing time: 15-60 minutes depending on service and photo count
