## Tasks

### Task: Polycam API integration
- **ID**: e06s01t01
- **Description**: Connect to Polycam API for photo upload and status polling
- **Verify**:
  ```powershell
  # Test upload endpoint
  $token = "YOUR_POLYCAM_TOKEN"
  $response = Invoke-RestMethod -Uri "https://app.polycam.com/api/upload" -Method Post -Headers @{"Authorization"="Bearer $token"} -Body @{file=[System.IO.File]::ReadAllBytes("C:\photos\photo1.jpg")}
  Write-Host "Upload response: $($response | ConvertTo-Json)"
  ```
- **Risk**: P1
- **Status**: failing

