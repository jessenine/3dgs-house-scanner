## Tasks

### Task: Process data script
- **ID**: e02s02t01
- **Description**: Create script to run COLMAP SfM processing on input images
- **Verify**:
  ```powershell
  # Test with photo folder
  python -m nerfstudio.scripts.process_data C:\photos C:\output --data-type images
  
  # Verify output structure
  Test-Path C:\output\data\images
  Test-Path C:\output\data\sparse
  ```
- **Risk**: P1
- **Status**: done

### Task: Train model script
- **ID**: e02s02t02
- **Description**: Create script to train splatfacto model
- **Verify**:
  ```powershell
  # Test training (with reduced iterations for testing)
  python -m nerfstudio.scripts.train splatfacto `
    --data C:\output\data `
    --output-dir C:\output\results `
    --max-num-iterations 1000 `
    --load-config ""
  ```
- **Risk**: P1
- **Status**: done

### Task: Export PLY script
- **ID**: e02s02t03
- **Description**: Create script to export trained model to PLY format
- **Verify**:
  ```powershell
  # Test export
  python -m nerfstudio.scripts.export --load-config C:\output\results\config.yml --output-path C:\output\point_cloud
  
  # Verify output
  Test-Path C:\output\point_cloud\iteration_30000\point_cloud.ply
  ```
- **Risk**: P2
- **Status**: done

## Acceptance Criteria
- [ ] Process data script accepts input/output paths
- [ ] Process creates COLMAP sparse point cloud and camera poses
- [ ] Train script runs splatfacto model
- [ ] Export creates PLY file with correct path structure
- [ ] All scripts handle errors with clear messages
- [ ] Documentation in README-POWERSHELL.md

## Notes
- Full training takes 45-90 minutes for 300-500 photos
- Training web server available at http://localhost:7562
- PLY output: 100-500MB, viewable in SuperSplat
