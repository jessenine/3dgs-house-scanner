## Tasks

### Task: PowerShell installation script
- **ID**: e02s01t01
- **Description**: Create script to install Nerfstudio with cu126 for Blackwell support
- **Verify**:
  ```powershell
  # Test installation
  python -m venv gs-env
  .\gs-env\Scripts\Activate.ps1
  pip install --upgrade pip setuptools wheel
  pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126
  pip install -e nerfstudio
  ```
- **Risk**: P1
- **Status**: done

### Task: COLMAP installation
- **ID**: e02s01t02
- **Description**: Auto-install COLMAP via winget for SfM processing
- **Verify**:
  ```powershell
  # Test COLMAP installation
  winget install --id COLMAP.COLMAP --accept-package-agreements
  colmap --help
  ```
- **Risk**: P2
- **Status**: done

## Acceptance Criteria
- [ ] Creates virtual environment with `python -m venv gs-env`
- [ ] Activates venv with `.\gs-env\Scripts\Activate.ps1`
- [ ] Upgrades pip, setuptools, wheel
- [ ] Installs PyTorch with cu126 (Windows wheels available)
- [ ] Installs Nerfstudio in editable mode
- [ ] Installs COLMAP via winget
- [ ] Verifies Blackwell GPU detection

## Notes
- cu126 is the only Windows-compatible CUDA version accessible via pip index
- cu121 and cu124 lack HTML directory listings for pip
- Virtual environment avoids system-wide Python conflicts
