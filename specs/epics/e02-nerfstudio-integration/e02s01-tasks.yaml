## Acceptance Criteria
- [x] Creates virtual environment with `python -m venv gs-env`
- [x] Activates venv with `.\gs-env\Scripts\Activate.ps1`
- [x] Upgrades pip, setuptools, wheel
- [x] Installs PyTorch with cu126 (Windows wheels available)
- [x] Installs Nerfstudio in editable mode
- [x] Installs COLMAP via winget
- [x] Verifies Blackwell GPU detection

## Notes
- cu126 is the only Windows-compatible CUDA version accessible via pip index
- cu121 and cu124 lack HTML directory listings for pip
- Virtual environment avoids system-wide Python conflicts
